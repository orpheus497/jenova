#!/bin/sh
# Hardware Profile: Generic NVIDIA CUDA Full Offload — OPT-IN ONLY
#
# CUDA is never selected automatically. NVIDIA hardware is driven through Vulkan
# by default; this profile exists for a user who has deliberately built with
# JENOVA_BACKEND=cuda and wants to deploy the matching runtime configuration.
#
# Deploy it explicitly:
#   jenova-core hardware apply CUDA/dgpu-generic
#   JENOVA_BACKEND=cuda make llama

PROFILE_NAME="CUDA/dgpu-generic"
PROFILE_DESC="Generic NVIDIA GPU, CUDA backend — opt-in only, never auto-selected"

# Action purpose: PROFILE_OPT_IN excludes this profile from auto-detection in
# detection. Without it, MATCH_GPU_0 below matches any NVIDIA GPU and
# would out-score the Vulkan profile on the very hardware that should default to
# Vulkan. The patterns are retained so --apply-profile still documents the target.
PROFILE_OPT_IN=1

# --- Detection patterns (informational; not used while PROFILE_OPT_IN=1) ---
MATCH_GPU_0="NVIDIA|GeForce|Quadro|RTX|GTX"
MATCH_OS="FreeBSD"

# --- Hardware summary ---
HW_CPU="Generic multi-core CPU"
HW_GPU_0="NVIDIA GPU with CUDA support"
HW_RAM="16+ GiB recommended"

# --- Inference strategy ---
STRATEGY="cuda-full-offload"
STRATEGY_DESC="Full offload to NVIDIA GPU via CUDA backend. Optimized for performance and low latency."

# --- Key config values (should match jenova.conf in this directory) ---
PROFILE_DEVICES="CUDA0"
PROFILE_TENSOR_SPLIT=""
PROFILE_FIT_TARGET="768"
PROFILE_CTX_SIZE="16384"
PROFILE_NUM_SLOTS="2"
PROFILE_THREADS="4"
PROFILE_NGL="all"
PROFILE_KV_TYPE="q8_0"
PROFILE_DRAFT="1"

# --- Model Recommendations ---
RECOMMENDED_AGENT_MODEL="qwen3.5-9b-uncensored-q8_0.gguf"
RECOMMENDED_AGENT_URL="https://huggingface.co/HauhauCS/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive/resolve/main/qwen3.5-9b-uncensored-q8_0.gguf"
RECOMMENDED_EMBED_MODEL="Qwen3-Embedding-0.6B-Q8_0.gguf"
RECOMMENDED_EMBED_URL="https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf"
