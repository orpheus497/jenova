#!/bin/sh
# jenova.conf: Jenova Cognitive Architecture — dGPU-Only 3B Profile (Optane)
# FreeBSD or Linux | GTX 1650 Ti 4GB (sole GPU) | i5-1135G7 | 16GB RAM | Optane NVMe
#
# Architecture: Single discrete GPU, PARTIAL offload, no drafter.
# 9B Q4_K_M agent model (~5.5 GiB) against 4 GiB of discrete VRAM, so ~16 of 36
# layers go to the GTX 1650 Ti and the remainder runs on the i5-1135G7.
# Intel Iris Xe iGPU deliberately excluded — avoids UMA contention with system RAM.
# No speculative drafter: there is no VRAM budget for one beside the offloaded
# layers and the KV cache.
# The machine it was sized on swaps to an Optane NVMe; Jenova does not set that up.
# These values are the ones profile.conf in this directory declares.

# --- Paths ---
if [ -z "$JENOVA_ROOT" ]; then
    echo "Error: JENOVA_ROOT is not set. This file must be sourced by a Jenova launcher." >&2
    echo "       Set JENOVA_ROOT to the project root before sourcing this jenova.conf." >&2
    return 1 2>/dev/null || exit 1
fi
JCA_HOME="${JCA_HOME:-$HOME/Jenova}"; export JCA_HOME
if [ "$JENOVA_LAYOUT" = "installed" ]; then
    LLAMA_SERVER="${LLAMA_SERVER:-$JENOVA_ROOT/bin/llama-server}"
else
    LLAMA_SERVER="${LLAMA_SERVER:-$JENOVA_ROOT/external/ext_bin/bin/llama-server}"
fi

# --- Models ---
# Model discovery moved into the Nim core (src/jenova/models.nim) so the running
# product relies on no shell script. MODEL_PATH, MODEL_DRAFT and
# MODEL_EMBED are resolved there, honouring JENOVA_MODEL, JENOVA_DRAFT_MODEL and
# JENOVA_EMBED_MODEL. Setting any of them here still wins — config.nim fills only
# what this file leaves empty.

# --- Speculative decoding ---
# Off (PROFILE_DRAFT=0). A 4 GiB card already holds a partially offloaded 9B and
# its KV cache; a 0.6 GiB drafter alongside it is what pushes the allocation over
# and thrashes weights back out to swap. DRAFT_DEVICE stays named so enabling it
# with JENOVA_DRAFT=1 lands on the GTX 1650 Ti rather than nowhere.
JENOVA_DRAFT="${JENOVA_DRAFT:-0}"
DRAFT_DEVICE="${JENOVA_DRAFT_DEVICE:-NVIDIA}"

# --- Thinking ---
# JENOVA_REASONING: on, off or auto (llama-server --reasoning). Left empty, a model
# in models/instruct runs without thinking and any other keeps the auto default.
JENOVA_REASONING="${JENOVA_REASONING:-}"

# --- Network ---
HOST="${JENOVA_HOST:-127.0.0.1}"
PORT="${JENOVA_PORT:-8080}"
LLAMA_PORT="${JENOVA_LLAMA_PORT:-8081}"
LLAMA_EMBED_PORT="${JENOVA_LLAMA_EMBED_PORT:-8082}"
_INT_HOST="$HOST"
if [ "$HOST" = "0.0.0.0" ] || [ "$HOST" = "::" ] || [ "$HOST" = "*" ]; then _INT_HOST="127.0.0.1"; fi
API_URL="http://${_INT_HOST}:${PORT}"
LLAMA_URL="http://${_INT_HOST}:${LLAMA_PORT}"
LLAMA_EMBED_URL="http://${_INT_HOST}:${LLAMA_EMBED_PORT}"

# --- Hardware: Single dGPU via Vulkan ---
# The NVIDIA GTX 1650 Ti (4 GiB discrete GDDR6), named because its Vulkan index
# differs between FreeBSD and Linux. The iGPU is excluded, so UMA does not take
# system RAM for GPU allocations.
# FIT_TARGET is inert on this profile: -fitt is only passed when NGL_AGENT=all,
# and this profile sets an explicit layer count. Kept for a JENOVA_NGL_AGENT=all
# override.
DEVICES="${JENOVA_DEVICES:-NVIDIA}"
TENSOR_SPLIT=""
FIT_TARGET="${JENOVA_FITT:-128}"

# GPU layers: partial offload (PROFILE_NGL=16). A 9B Q4_K_M is ~5.5 GiB against
# 4 GiB of discrete VRAM, so it does not fit; ~16 of 36 layers sit on the GPU and
# the rest on the CPU. An explicit count also skips -fitt, which conflicts with
# it — see lifecycle.llamaArgs.
NGL_AGENT="${JENOVA_NGL_AGENT:-16}"

# --- Context & Slots ---
# One slot at 8K (PROFILE_CTX_SIZE / PROFILE_NUM_SLOTS). llama.cpp divides the
# context between slots, so two slots here would give each 4K; a single slot
# keeps the whole 8K available to one conversation and keeps the KV footprint
# small enough to leave VRAM for the offloaded layers.
# Optane NVMe swap pages the CPU-side layers and KV overflow at ~7 μs.
CTX_SIZE="${JENOVA_CTX:-8192}"
NUM_SLOTS="${JENOVA_SLOTS:-1}"
KV_CACHE_TYPE="${JENOVA_KV_TYPE:-q8_0}"

# --- Threads: i5-1135G7 = 4P cores / 8 logical ---
THREADS="${JENOVA_THREADS:-4}"
THREADS_BATCH="${JENOVA_THREADS_BATCH:-6}"

# --- Batch sizes (controls VRAM pressure during prompt ingestion) ---
# Reduced for tight-VRAM GPUs (4 GiB dGPU / 2-4 GiB UMA) to prevent
# Vulkan OOM that thrashes model weights out of VRAM onto swap.
BATCH_SIZE="${JENOVA_BATCH:-512}"
UBATCH_SIZE="${JENOVA_UBATCH:-128}"

# --- Agent ---
MAX_TURNS="${JENOVA_MAX_TURNS:-25}"
MAX_ACTIONS=20
TIMEOUT="${JENOVA_TIMEOUT:-600}"

# --- Watchdog ---
# The watchdog polls every 30 s; JENOVA_WATCH_INTERVAL is not read.

# --- Health timeout ---
# `config.nim` lists this key, but no code reads it.
JENOVA_HEALTH_TIMEOUT="${JENOVA_HEALTH_TIMEOUT:-90}"

# --- Runtime ---
JENOVA_STATE="${JENOVA_STATE:-$JCA_HOME/.system}"
LOG_DIR="${LOG_DIR:-$JCA_HOME/var/log}"
CACHE_DIR="${CACHE_DIR:-$JCA_HOME/var/cache}"
PID_FILE="${PID_FILE:-$JENOVA_STATE/jenova-ca.pid}"
