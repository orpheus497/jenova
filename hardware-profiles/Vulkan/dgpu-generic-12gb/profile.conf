#!/bin/sh
# Hardware Profile: Generic Vulkan Full Offload — 14B model
# This file describes the hardware profile for auto-detection matching.

PROFILE_NAME="Vulkan/dgpu-generic-12gb"
PROFILE_DESC="Vulkan GPU with 12GB+ VRAM (allowlisted models) — Qwen3.5-9B Q8_0 full offload"

# --- Detection patterns (read by src/jenova/hardware.nim) ---
# Action purpose: an allowlist of cards with 12 GiB or more, because this profile
# offloads every layer at 32K context and detection reads no VRAM figure. An
# unlisted card falls to CPU/generic; add a card here, never a vendor word.
MATCH_GPU_0="RTX (3080|3090|4070|4080|4090|5070 Ti|5080|5090)|RX (6800|6900|6950|7800|7900|9070)|Arc.*A770"
# Action purpose: MATCH_OS is set, not left empty: empty takes the -5 generic
# penalty, a total of 0, which `bestProfile` never selects. Set, it scores 25 —
# above CPU/generic (20), below every hardware-specific profile (30+).
MATCH_OS="FreeBSD|Linux"

# --- Hardware summary ---
HW_CPU="Generic multi-core CPU (4+ cores recommended)"
HW_GPU_0="Vulkan-capable GPU with 12GB+ VRAM (NVIDIA RTX/AMD RX/Intel Arc)"
HW_RAM="16+ GiB recommended"
HW_SWAP="Optional — not required with sufficient VRAM"
HW_GPU_TOTAL_VRAM="12+ GiB (14+ GiB recommended for 9B Q8_0 with large context)"

# --- Inference strategy ---
STRATEGY="full-offload"
STRATEGY_DESC="Qwen3.5-9B-Q8_0 (~9.5 GiB) fully offloaded to a single Vulkan GPU with 12GB+ VRAM. Optimized for high-quality inference with larger context windows. Suitable for NVIDIA RTX 3080/4070/4080/4090, AMD RX 7900, Intel Arc A770 with sufficient VRAM."

# --- Key config values (should match jenova.conf in this directory) ---
PROFILE_DEVICES="RTX (3080|3090|4070|4080|4090|5070 Ti|5080|5090)|RX (6800|6900|6950|7800|7900|9070)|Arc.*A770"
PROFILE_TENSOR_SPLIT=""
PROFILE_FIT_TARGET="1024"
PROFILE_CTX_SIZE="32768"
PROFILE_NUM_SLOTS="2"
PROFILE_THREADS="4"
PROFILE_THREADS_BATCH="6"
PROFILE_NGL="all"
PROFILE_KV_TYPE="q8_0"
PROFILE_DRAFT="1"

# --- Model Recommendations ---
RECOMMENDED_AGENT_MODEL="Qwen3.5-9B-Q8_0.gguf"
RECOMMENDED_AGENT_URL="https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q8_0.gguf"
RECOMMENDED_EMBED_MODEL="Qwen3-Embedding-0.6B-Q8_0.gguf"
RECOMMENDED_EMBED_URL="https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf"
